<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regitrar Pokemons</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Pokedex</h1>
    <form>
        <input type="text" id="NomePokemon" placeholder="Digite o nome do Pokemon" />
        <input type="text" id="Tipo" placeholder="Digite o nome do Tipo" />
        <button type="button" id="btnCadastrar">
            Cadastrar
        </button>
    </form>
    <form>
        <input type="text" id="idPokemon" placeholder="Digite o id do Pokemon" />
        <input type="text" id="editarNomePokemon" placeholder="Digite o novo nome do Pokemon" />
        <input type="text" id="editarTipo" placeholder="Digite o novo Tipo" />
        <button type="button" id="btnEditar">
            Editar
        </button>
    </form>
    <div class="conteinerTabela">
        <table border="1" cellspacing="0" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaItens"></tbody>
        </table>


        <div class="bolinhaFora">
            <div class="bolinhaDentro"></div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>

</html>
